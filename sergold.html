<!DOCTYPE html>
<html lang="ar" dir='rtl'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	
    <title>السر الذهبي</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Amiri Quran",cursive, serif;, Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1976D2;
            display: grid;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #f5f5f5;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
		
		.hcontainer {
      background-color: #f5f5f5;
	  width: 100%;
      padding-right: 15px;
      padding-left: 15px;
      margin-right: auto;
      margin-left: auto;
      box-sizing: border-box;
    }
		.custom-header {
    display: flex;
    justify-content: center;
    padding-top: 1rem;
    padding-bottom: 1rem;
}

.nav-pills {
    display: flex;
    flex-wrap: wrap;
    padding-left: 0;
    margin-bottom: 0;
    list-style: none;
    gap: 0.5rem;
    justify-content: center;
}
	.nav-link.active {
    color: #fff;
    background-color: #0d6efd;
}
		.nav-link {
    display: block;
    padding: 0.5rem 1rem;
    color: #0d6efd;
    text-decoration: none;
    border-radius: 0.375rem;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
}
		
        h2 {
            color: #333333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #444444;
            cursor: pointer;
        }
        .radio-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        label.box-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #666666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            background-color: #ffffff;
            margin-bottom: 25px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        textarea:focus {
            border-color: #2196F3;
        }
        .output-box {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
            /* Ensures long strings or sentences wrap perfectly instead of breaking layout */
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            color: #222222;
        }
    </style>
</head>
<body>

<div class="hcontainer">
<header class="custom-header">
      <ul class="nav-pills">
        <li><a href="index.html" class="nav-link active" aria-current="page">حساب الحروف</a></li>
        <li><a href="sergold.html" class="nav-link">السر الذهبي</a></li>
        <li><a href="about.html" class="nav-link">نبذة عن التطبيق</a></li>
      </ul>
    </header>
</div>

<div class="container">
    <h2>السر الذهبي</h2>
    
    <!-- Radio selection toggle -->
    <div class="radio-group">
        <label class="radio-label">
            <input type="radio" name="mode" value="encode" checked id="modeEncode"> السر
        </label>
        <label class="radio-label">
            <input type="radio" name="mode" value="decode" id="modeDecode"> فك السر
        </label>
    </div>

    <label class="box-label" for="inputText">النص</label>
    <textarea id="inputText" placeholder="ادخل النص هنا..."></textarea>
	<div class="count-display">عدد الأحرف <span id="charCount">0</span>
	</div>

    <label class="box-label">النتيجة</label>
    <div class="output-box" id="outputText"></div>
</div>

<script>
    // 1. Setup translation alphabets matching your Python dictionary rules
    const st  = "abcdefghijklmnopqrstuvwxyz";
    const st2 = "afkpuzbglqvchmrwdinsxejoty";

    // Build the bi-directional dictionaries
    const encodeMap = {'ا': 'أ','إ': 'أ','أ': 'أ', 'ب': 'ب', 'ت': 'ج', 'ث': 'د', 'ج': 'ه', 'ح': 'و', 'خ': 'ز', 'د': 'ح', 'ذ': 'ط', 'ر': 'ي', 'ز': 'ك', 'س': 'ل', 'ش': 'م', 'ص': 'ن', 'ض': 'س', 'ط': 'ع', 'ظ': 'ف', 'ع': 'ص', 'غ': 'ق', 'ف': 'ر', 'ق': 'ش', 'ك': 'ت', 'ل': 'ث', 'م': 'خ', 'ن': 'ذ', 'ه': 'ض','ة': 'ض', 'و': 'ظ','ؤ': 'أ', 'ي': 'غ'};
    
	const decodeMap = {'ا': 'أ','أ': 'أ','إ': 'أ', 'ب': 'ب', 'ج': 'ت', 'د': 'ث', 'ه': 'ج', 'و': 'ح','ؤ': 'أ', 'ز': 'خ', 'ح': 'د', 'ط': 'ذ', 'ي': 'ر', 'ك': 'ز', 'ل': 'س', 'م': 'ش', 'ن': 'ص', 'س': 'ض', 'ع': 'ط', 'ف': 'ظ', 'ص': 'ع', 'ق': 'غ', 'ر': 'ف', 'ش': 'ق', 'ت': 'ك', 'ث': 'ل', 'خ': 'م', 'ذ': 'ن', 'ض': 'ه', 'ظ': 'و', 'غ': 'ي'};

    const inputArea = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const encodeRadio = document.getElementById('modeEncode');
	const countSpan = document.getElementById('charCount'); 
	
    // 2. Cipher Core Processing Function
    function processText() {
        const text = inputArea.value;
        const isEncode = encodeRadio.checked;
        const currentMap = isEncode ? encodeMap : decodeMap;
		const textWithoutSpaces = text.replace(/\s/g, '');
        countSpan.textContent = textWithoutSpaces.length;
        		
        let result = [];

        for (let char of text) {
            let lowerChar = char.toLowerCase();
            
            if (currentMap[lowerChar] !== undefined) {
                // Keep the structural capitalization of the letter if needed
                let transformed = currentMap[lowerChar];
                result.push(char === char.toUpperCase() ? transformed.toUpperCase() : transformed);
            } else {
                // Pass spacing, punctuation, and non-English text straight through
                result.push(char);
            }
        }

        // Output formatting: matches the ' '.join() style requirement from your Python script
        // Filter out double-spaces caused by joining array steps
        outputDiv.textContent = result.join(isEncode ? ' ' : '').replace(/\s+/g, ' ').trim();
    }

    // 3. Real-time updates attached to text entries and toggle changes
    inputArea.addEventListener('input', processText);
    document.getElementsByName('mode').forEach(radio => {
        radio.addEventListener('change', processText);
    });
</script>

</body>
</html>
