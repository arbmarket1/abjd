<!DOCTYPE html>
<html lang="ar" dir='rtl'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	
    <title>برنامج حساب الجمل</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Amiri Quran",Arial,cursive,'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1976D2;
            display: grid;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
			direction: rtl;
        }
        .container {
            background-color: #f5f5f5;
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 10px;
			border-radius: 16px;
        }
		.hcontainer {
      background-color: #f5f5f5;
	  width: 100%;
      padding-right: 15px;
      padding-left: 15px;
      margin-right: auto;
      margin-left: auto;
      box-sizing: border-box;
    }
		.custom-header {
    display: flex;
    justify-content: center;
    padding-top: 1rem;
    padding-bottom: 1rem;
}
.nav-pills {
    display: flex;
    flex-wrap: wrap;
    padding-left: 0;
    margin-bottom: 0;
    list-style: none;
    gap: 0.5rem;
    justify-content: center;
}
	.nav-link.active {
    color: #fff;
    background-color: #0d6efd;
}
		.nav-link {
    display: block;
    padding: 0.5rem 1rem;
    color: #0d6efd;
    text-decoration: none;
    border-radius: 0.375rem;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
}
        h2 {
            color: #000000;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .input-container {
            margin-bottom: 35px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 320px;
            padding: 15px 20px;
            font-size: 22px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.1);
            outline: none;
            background-color: #ffffff;
        }
        input[type="text"]:placeholder-shown {
            direction: ltr;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #000000;
            width: 25%;
            height: 65px;
            vertical-align: middle;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        th {
            background-color: #e0e0e0;
            color: #000000;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        th:first-child {
            border: none;
        }
        td:first-child {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            background-color: #e0e0e0;
            border-bottom: none;
            border-left: none;
            border-top: none;
        }
        .value-cell {
            color: #2196F3;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="hcontainer">
<header class="custom-header">
      <ul class="nav-pills">
        <li><a href="index.html" class="nav-link active" aria-current="page">حساب الحروف</a></li>
        <li><a href="sergold.html" class="nav-link">السر الذهبي</a></li>
        <li><a href="about.html" class="nav-link">نبذة عن التطبيق</a></li>
      </ul>
    </header>
</div>

<div class="container">
	<div class="callout"><a href="https://almushaikhi.forumarabia.com/forum">للمزيد تفضل بزيارة منتدى الصادق الأمين الروحاني لأبوأزهر المشايخي</a> </div> 
</div>

<div class="container">
	
    <h2>حساب الحروف</h2>
    
    <div class="input-container">
        <!-- dir="auto" flips typing alignment to right-to-left dynamically for Arabic/Hebrew -->
        <input type="text" id="numInput" dir="auto" placeholder="حي قيوم" autocomplete="off">
    </div>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>رقمي</th>
                <th>حرفي</th>
                <th>عددي</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>كبير</td>
                <td class="value-cell" id="cell-big-digits">-</td>
                <td class="value-cell" id="cell-big-chars">-</td>
                <td class="value-cell" id="cell-big-numric">-</td>
            </tr>
            <tr>
                <td>مرتبة</td>
                <td class="value-cell" id="cell-mid-digits">-</td>
                
            </tr>
            <tr>
                <td>صغير</td>
                <td class="value-cell" id="cell-small-digits">-</td>
                
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 1. GLOBAL MULTI-LANGUAGE DATABASE FOR EVERY CELL
    // Instead of arrays, map specific characters straight to their values.
    // This allows you to mix English, Arabic, and Hebrew completely in one place.
    const LOOKUP_MAPS = {
        "cell-big-digits": {
       
            // Arabic Abjad Standard Values (أبجد هوز حطي كلمن...)
            'أ':1,'إ':1, 'ا':1,'ى':1, 'ب':2, 'ج':3, 'د':4, 'ه':5,'ة':5, 'و':6,'ؤ':1, 'ز':7, 'ح':8, 'ط':9, 'ي':10,'ئ':1, 'ك':20, 'ل':30, 'م':40, 'ن':50, 'س':60, 'ع':70, 'ف':80, 'ص':90, 'ق':100, 'ر':200, 'ش':300, 'ت':400, 'ث':500, 'خ':600, 'ذ':700, 'ض':800, 'ظ':900, 'غ':1000,
        },

        "cell-big-chars": {
       
            // Arabic Example Small/Reduced Values (Example only)
            'ا': 111,'إ': 111,'أ': 111,'ى': 111, 'ب': 3, 'ج': 53, 'د': 35, 'ه': 6,'ة': 6, 'و': 13,'111': 13, 'ز': 18, 'ح': 9, 'ط': 10, 'ي': 11,'ئ': 111, 'ك': 101, 'ل': 71, 'م': 90, 'ن': 106, 'س': 120, 'ع': 130, 'ف': 81, 'ص': 95, 'ق': 181, 'ر': 201, 'ش': 360, 'ت': 401, 'ث': 501, 'خ': 601, 'ذ': 731, 'ض': 805, 'ظ': 901, 'غ': 1060,
          
        },

        "cell-big-numric": {
         
            // Add custom Arabic or Hebrew configurations for this calculation method below
			'ا': 19,'أ': 19,'إ': 19,'ى': 19, 'ب': 611, 'ج': 1036, 'د': 278, 'ه': 705,'ة': 705, 'و': 465,'ؤ': 19, 'ز': 137, 'ح': 606, 'ط': 535, 'ي': 575,'ئ': 19, 'ك': 630, 'ل': 1091, 'م': 333, 'ن': 760, 'س': 520, 'ع': 192, 'ف': 651, 'ص': 590, 'ق': 56, 'ر': 511, 'ش': 1087, 'ت': 329, 'ث': 756, 'خ': 516, 'ذ': 188, 'ض': 647, 'ظ': 586, 'غ': 111,
        },

        // --- Placeholders for remaining 6 methods ---
        "cell-mid-digits":   {
		'ا': 1,'أ': 1,'إ': 1,'ى': 1, 'ب': 2, 'ج': 3, 'د': 4, 'ه': 5,'ة': 5, 'و': 6,'ؤ': 1, 'ز': 7, 'ح': 8, 'ط': 9, 'ي': 10,'ئ': 1, 'ك': 11, 'ل': 12, 'م': 13, 'ن': 14, 'س': 15, 'ع': 16, 'ف': 17, 'ص': 18, 'ق': 19, 'ر': 20, 'ش': 21, 'ت': 22, 'ث': 23, 'خ': 24, 'ذ': 25, 'ض': 26, 'ظ': 27, 'غ': 28,
		},
        "cell-small-digits": {
		
		'ا': 1,'أ': 1,'إ': 1,'ى': 1, 'ب': 2, 'ج': 3, 'د': 4, 'ه': 5,'ة': 5, 'و': 6,'ؤ': 1, 'ز': 7, 'ح': 8, 'ط': 9, 'ي': 1,'ئ': 1, 'ك': 2, 'ل': 3, 'م': 4, 'ن': 5, 'س': 6, 'ع': 7, 'ف': 8, 'ص': 9, 'ق': 1, 'ر': 2, 'ش': 3, 'ت': 4, 'ث': 5, 'خ': 6, 'ذ': 7, 'ض': 8, 'ظ': 9, 'غ': 1,
		}
    };

    // 2. RUNTIME CALCULATION CORE
    function calculate() {
        let rawText = document.getElementById('numInput').value;
        
        // Lowercase English letters, but keep Arabic and Hebrew Unicode structures intact
        let cleanText = rawText.toLowerCase().replace(/[\s\p{P}]/gu, '');

        if (cleanText.length === 0) {
            clearTable();
            return;
        }

        // Cycle through your 9 display layout elements
        for (const cellId in LOOKUP_MAPS) {
            let totalCellSum = 0;

            // Step across each individual typed letter
            for (let char of cleanText) {
                // Instantly checks if letter exists in database for this specific grid cell
                if (LOOKUP_MAPS[cellId][char] !== undefined) {
                    totalCellSum += LOOKUP_MAPS[cellId][char];
                }
            }

            // Print true cumulative index total straight to the UI matrix
            document.getElementById(cellId).innerText = totalCellSum;
        }
    }

    function clearTable() {
        for (const cellId in LOOKUP_MAPS) {
            document.getElementById(cellId).innerText = '-';
        }
    }

    document.getElementById('numInput').addEventListener('input', calculate);
</script>

</body>
</html>
